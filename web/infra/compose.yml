# Local stack: API and database only. No TLS, no domain, no Telegram, no
# attestation — sign in with any id and start playing.
name: nfcit-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nfcit
      POSTGRES_USER: nfcit
      POSTGRES_PASSWORD: nfcit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfcit -d nfcit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NFCIT_DB: postgres://nfcit:nfcit@db:5432/nfcit?sslmode=disable
      # dev takes `tg_id[:name]` in place of a token, which keeps two phones
      # playable before the bot is registered. NFCIT_AUTH_MODE=telegram make dev
      # switches the same stack to real logins.
      NFCIT_AUTH_MODE: ${NFCIT_AUTH_MODE:-dev}
      NFCIT_TELEGRAM_CLIENT_ID: ${NFCIT_TELEGRAM_CLIENT_ID:-}
      NFCIT_ATTESTATION: "off"
      NFCIT_BOARD_INTERVAL_SECONDS: "2"
    ports:
      # Override when something else already owns 8080: NFCIT_PORT=8090 make dev.
      # NFCIT_BIND=0.0.0.0 exposes it to the network, which a phone on the same
      # wifi needs to reach a debug build; the default keeps it on the loopback.
      - "${NFCIT_BIND:-127.0.0.1}:${NFCIT_PORT:-8080}:8080"
    # The image already carries the landing page; mounting it over the top means
    # editing it locally is a browser reload rather than a rebuild.
    volumes:
      - ../public:/srv/web/public:ro
    restart: unless-stopped

volumes:
  pgdata:
