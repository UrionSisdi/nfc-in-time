name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

# Telegram's login SDK lives in GitHub Packages and is readable only with a
# personal token: the built-in GITHUB_TOKEN can read packages of this repository
# alone. PACKAGES_TOKEN is a classic token with read:packages.
env:
  GITHUB_USERNAME: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
  NFCIT_TELEGRAM_CLIENT_ID: ${{ vars.NFCIT_TELEGRAM_CLIENT_ID }}
  NFCIT_TELEGRAM_APP_ID: ${{ vars.NFCIT_TELEGRAM_APP_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          NFCIT_KEYSTORE: ${{ runner.temp }}/release.jks
          NFCIT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NFCIT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NFCIT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          NFCIT_BASE_URL: ${{ vars.NFCIT_BASE_URL }}
        run: ./gradlew assembleRelease

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The updater fetches releases/latest/download/nfc-in-time.apk, so the
          # asset has to carry the same name at every tag.
          mv app/build/outputs/apk/release/*.apk nfc-in-time.apk
          gh release create "${{ github.ref_name }}" nfc-in-time.apk \
            --notes-file ../.github/release-notes.md --generate-notes
